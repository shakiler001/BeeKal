name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml, so a tag cannot publish images that never
  # passed the same gates a pull request has to.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beekal
          POSTGRES_PASSWORD: beekal_ci
          POSTGRES_DB: beekal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://beekal:beekal_ci@localhost:5432/beekal_test
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci_only_secret_not_used_anywhere_real_padding_here
      STORAGE_DRIVER: local
      MAIL_DRIVER: console

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @beekal/web exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # Runs against the built site with no API. Pages that need one are not in
      # this suite; the admin ones assert that they redirect, which is exactly
      # what should happen when nobody is signed in.
      - name: Accessibility (every page, both themes)
        run: pnpm --filter @beekal/web exec playwright test accessibility --project=desktop

      - name: Critical paths
        run: pnpm --filter @beekal/web exec playwright test critical-paths --project=desktop

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the no-lock-in compliance test still holds: the stack must build
      # from a bare checkout (docs/00 section 3).
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
