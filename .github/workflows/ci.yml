name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml, so a tag cannot publish images that never
  # passed the same gates a pull request has to.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beekal
          POSTGRES_PASSWORD: beekal_ci
          POSTGRES_DB: beekal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://beekal:beekal_ci@localhost:5432/beekal_test
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci_only_secret_not_used_anywhere_real_padding_here
      STORAGE_DRIVER: local
      MAIL_DRIVER: console

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @beekal/web exec playwright install chromium --with-deps

      # Only the web app and what it depends on. Building the API here would
      # need a generated Prisma client and a database that this job has no
      # reason to run — the e2e suite tests the site, not the API.
      - name: Build web
        run: pnpm turbo build --filter=@beekal/web

      # Runs against the built site with no API. Pages that need one are not in
      # this suite; the admin ones assert that they redirect, which is exactly
      # what should happen when nobody is signed in.
      - name: Accessibility (every page, both themes)
        run: pnpm --filter @beekal/web exec playwright test accessibility --project=desktop

      - name: Critical paths
        run: pnpm --filter @beekal/web exec playwright test critical-paths --project=desktop

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One image per runner. Building both in sequence on a single runner filled
    # the ~14GB of free disk a GitHub runner has — the API image built, then
    # web failed — because each carries a full node_modules layer and the
    # buildx cache is written alongside them.
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v4

      # A stock runner ships with Android SDKs, .NET and a GHC toolchain that
      # nothing here uses. Reclaiming them buys roughly 20GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
          df -h /

      # Catches the failure mode where an image builds on every developer
      # machine and fails on every runner: a path that exists locally but was
      # never committed. Cheap, and it runs before the slow build.
      - name: Dockerfile paths exist in a fresh checkout
        run: bash infra/scripts/check-docker-paths.sh

      - uses: docker/setup-buildx-action@v3

      # Proves the no-lock-in compliance test still holds: the stack must build
      # from a bare checkout (docs/00 section 3).
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          # mode=min here rather than max: this job only has to prove the image
          # builds, and caching every intermediate layer is what filled the
          # disk in the first place. release.yml keeps mode=max, where the
          # cache actually pays for itself.
          cache-to: type=gha,mode=min,scope=${{ matrix.app }}
