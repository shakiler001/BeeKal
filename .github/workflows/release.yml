name: Release

# Builds and publishes images on a tag, then the server pulls them.
#
# Deliberately NOT push-to-deploy from main: a deploy should be a decision
# someone made, with a version number attached to it, so a rollback has
# something to roll back to.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify before publishing
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Ready to deploy
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo '```bash'
            echo "cd /opt/beekal"
            echo "git fetch --tags && git checkout ${GITHUB_REF_NAME}"
            echo "pnpm docker:up --build"
            echo '```'
            echo ""
            echo "The API must pass /health before the old container stops."
            echo "If it does not, nothing switches over."
          } >> "$GITHUB_STEP_SUMMARY"
