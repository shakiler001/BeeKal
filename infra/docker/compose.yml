# Beekal — local and single-VPS stack.
#
# Every service is a standard open-source image. `docker compose up` on a bare
# Ubuntu box must produce a fully working system — that is the compliance test
# for the no-lock-in rule (docs/00 section 3).

name: beekal

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beekal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beekal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beekal}
      # Deterministic collation, so ORDER BY does not shift between hosts.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beekal} -d ${POSTGRES_DB:-beekal}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # quay.io, not Docker Hub: MinIO stopped serving minio/minio:latest there.
    # Pinned to a release tag — 'latest' would drift under us on every pull.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-beekal_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-beekal_minio_dev_password}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first run, then exits. Without this the API
  # fails its first upload against a fresh volume.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-beekal_minio} ${S3_SECRET_KEY:-beekal_minio_dev_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-beekal-media} &&
      mc anonymous set download local/${S3_BUCKET:-beekal-media} &&
      echo 'MinIO bucket ready'
      "
    restart: 'no'

  # Runs migrations and the seed once, then exits. The API waits for it to
  # finish successfully, so a container never serves against an older schema.
  # Built from the `build` stage because the runtime image has no Prisma CLI.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beekal}:${POSTGRES_PASSWORD:-beekal_dev_password}@postgres:5432/${POSTGRES_DB:-beekal}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Owner}
    working_dir: /app/apps/api
    command: >
      sh -c "pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.ts"
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beekal}:${POSTGRES_PASSWORD:-beekal_dev_password}@postgres:5432/${POSTGRES_DB:-beekal}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required - see .env.example}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-beekal-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-beekal_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-beekal_minio_dev_password}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/beekal-media}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      # Set to the number of reverse proxies in front of this container. Left
      # at 0 behind a proxy, every visitor shares one rate-limit counter.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Self-hosted, cookie-free analytics. No cross-site tracking and no data
  # leaving this machine — which is also why the site needs no cookie banner,
  # and that is a conversion advantage as much as a privacy one.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beekal}:${POSTGRES_PASSWORD:-beekal_dev_password}@postgres:5432/${UMAMI_DB:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_SECRET:?UMAMI_SECRET is required - see .env.example}
      DISABLE_TELEMETRY: '1'
    ports:
      - '${UMAMI_PORT:-3001}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/heartbeat'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  minio_data:
